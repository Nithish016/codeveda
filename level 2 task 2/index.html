<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 2 Task 2 | Persistent To-Do List App</title>
    <meta name="description" content="A functional and responsive To-Do List Application with local storage persistence and dynamic filtering.">
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Outfit Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Style connection -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="todo-app">
        <h1>Veda<span>Tasks</span></h1>
        <p class="subtitle">Level 2 Task 2 | Persistent To-Do App</p>

        <!-- Input Section -->
        <div class="input-section">
            <input type="text" placeholder="Add a new task..." id="todo-input" autocomplete="off">
            <button class="btn-add" id="add-btn" aria-label="Add Task">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>

        <!-- Controls Section -->
        <div class="controls-section">
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
            <button class="btn-clear" id="clear-btn">Clear Completed</button>
        </div>

        <!-- Task List -->
        <ul class="task-list" id="task-list">
            <!-- Dynamically populated -->
        </ul>
    </div>

    <!-- Script connection -->
    <script src="script.js"></script>
</body>
</html>
